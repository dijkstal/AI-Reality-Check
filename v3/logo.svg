<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 62" fill="none">
  <!-- Compass symbol: centre (32,31), radius 22 -->
  <!-- Navy large arc: clockwise from 330° (upper-right) → 90° (bottom) → 210° (upper-left), 240° -->
  <path d="M 51.1,20 A 22,22 0 1,1 12.9,20"
        stroke="#1C2D6E" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Red short arc: clockwise from 210° (upper-left) → 270° (top) → 330° (upper-right), 120° -->
  <path d="M 12.9,20 A 22,22 0 0,1 51.1,20"
        stroke="#C0392B" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- Red arrow tip at upper-left (210°), pointing NW -->
  <polygon points="12.9,20 4,13 14,11" fill="#C0392B"/>
  <!-- Navy arrow tip at lower-right (opposite side, ~30°), pointing SE -->
  <polygon points="51.1,20 58,39 48,38" fill="#1C2D6E"/>
  <!-- "Polestar" text -->
  <text x="68" y="28"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="23" font-weight="900" fill="#1C2D6E" letter-spacing="-0.4">Polestar</text>
  <!-- "Company" text -->
  <text x="68" y="52"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif"
        font-size="17" font-weight="700" fill="#C0392B">Company</text>
</svg>
